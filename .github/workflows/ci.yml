name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "3 7 * * 5"
  push:
    branches: [master, main]
  pull_request:

jobs:
  parallel-run-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r data_generator/requirements.txt
          pip install pytest jsonschema

      - name: Generate fresh source data
        run: python data_generator/generate_source_data.py

      - name: Build both pipeline outputs (legacy-mirror + fabric-mirror)
        run: python validation/build_local_reference_outputs.py

      - name: Run parallel-run validation (fails job on NO-GO)
        run: python validation/parallel_run_validation.py

      - name: Reconcile GIS assets and publish the accepted feature layer
        run: python examples/gis_asset_integration/reconcile_gis_assets.py

      - name: Run validation framework tests (incl. corruption negative tests)
        run: pytest tests/ -v

      # The README badge is a claim about this suite, and nothing used to
      # compare the two. healthcare's badge sat at 182 while its suite had
      # grown to 345 -- the number was counting test functions, not collected
      # cases, and no check could see the difference. This fails the build if
      # the badge and the suite ever disagree again.
      - name: The README test badge must match what the suite collects
        run: |
          collected=$(python -m pytest --collect-only -q 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          claimed=$(grep -oE 'badge/tests-[0-9%C,]+%20passing' README.md | head -1 | sed -E 's|badge/tests-||; s|%20passing||; s|%2C||g; s|,||g')
          echo "suite collects: ${collected:-<none>}   README badge: ${claimed:-<none>}"
          if [ -z "$collected" ] || [ -z "$claimed" ]; then
            echo "::error::could not read one of the two numbers"; exit 1
          fi
          if [ "$collected" != "$claimed" ]; then
            echo "::error::README badge says $claimed, suite collects $collected"; exit 1
          fi
